<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 내 차 어딨지? 앱 아이콘 원본(직접 그린 벡터). npm run icons 로 PNG 생성 -->
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#2463EB"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F6FC"/>
      <stop offset="1" stop-color="#E3EBF7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EFF7"/>
    </linearGradient>
    <clipPath id="tile"><rect x="150" y="210" width="724" height="640" rx="120"/></clipPath>
  </defs>
  <rect id="bg" width="1024" height="1024" rx="232" fill="#FFFFFF"/>
  <!-- 지도 타일 -->
  <rect x="150" y="210" width="724" height="640" rx="120" fill="url(#map)"/>
  <g clip-path="url(#tile)" fill="none" stroke-linecap="round">
    <path d="M90 640 L940 430" stroke="#FFFFFF" stroke-width="54"/>
    <path d="M330 900 L600 160" stroke="#FFFFFF" stroke-width="44"/>
    <path d="M120 360 L520 520 L960 760" stroke="#FFFFFF" stroke-width="26" opacity="0.9"/>
    <path d="M700 180 L860 900" stroke="#FFFFFF" stroke-width="22" opacity="0.8"/>
    <path d="M90 640 L940 430" stroke="#D5E0EF" stroke-width="4" stroke-dasharray="26 22"/>
  </g>
  <!-- 핀 -->
  <ellipse cx="410" cy="735" rx="74" ry="18" fill="#C6D3E6"/>
  <path d="M410 728 C350 640 220 540 220 390 A190 190 0 1 1 600 390 C600 540 470 640 410 728 Z" fill="url(#pin)"/>
  <circle cx="410" cy="388" r="118" fill="#FFFFFF"/>
  <path d="M384 462 V318 H434 A46 46 0 0 1 434 410 H384" fill="none" stroke="#2463EB" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 차(정면) -->
  <ellipse cx="690" cy="842" rx="182" ry="24" fill="#C6D3E6"/>
  <rect x="540" y="770" width="58" height="72" rx="18" fill="#2A3344"/>
  <rect x="782" y="770" width="58" height="72" rx="18" fill="#2A3344"/>
  <ellipse cx="540" cy="596" rx="26" ry="16" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="6"/>
  <ellipse cx="840" cy="596" rx="26" ry="16" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="6"/>
  <path d="M568 610 L612 506 Q622 484 648 484 H732 Q758 484 768 506 L812 610 Z" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="6" stroke-linejoin="round"/>
  <path d="M594 610 L628 526 Q634 510 652 510 H728 Q746 510 752 526 L786 610 Z" fill="#2E3A50"/>
  <path d="M640 520 L612 596" stroke="#46546E" stroke-width="10" stroke-linecap="round"/>
  <rect x="520" y="596" width="340" height="190" rx="56" fill="url(#body)" stroke="#C9D4E3" stroke-width="6"/>
  <rect x="548" y="636" width="78" height="38" rx="19" fill="#EEF3FA" stroke="#B8C5D8" stroke-width="5"/>
  <rect x="754" y="636" width="78" height="38" rx="19" fill="#EEF3FA" stroke="#B8C5D8" stroke-width="5"/>
  <circle cx="574" cy="655" r="11" fill="#9FB4D3"/>
  <circle cx="806" cy="655" r="11" fill="#9FB4D3"/>
  <rect x="636" y="690" width="108" height="34" rx="14" fill="#2E3A50"/>
  <rect x="660" y="742" width="60" height="22" rx="6" fill="#FFFFFF" stroke="#C9D4E3" stroke-width="4"/>
